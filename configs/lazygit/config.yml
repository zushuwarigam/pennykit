# GUI
gui:
  # Window layout
  expandFocusedSidePanel: true
  mainPanelSplitMode: flexible # horizontal / vertical / flexible
  enlargedSideViewLocation: left
  sidePanelWidth: 0.25
  # Theme — integrates well with WezTerm
  nerdFontsVersion: "3"
  border: rounded
  theme:
    activeBorderColor: [yellow, bold] # gruvbox yellow
    inactiveBorderColor: [white]
    selectedLineBgColor: [default]
    cherryPickedCommitBgColor: [cyan]
    cherryPickedCommitFgColor: [blue]
    unstagedChangesColor: [red]
  # Behaviour
  mouseEvents: true
  skipDiscardChangeWarning: false
  skipStashWarning: false
  showFileTree: true # group files by directory
  showListFooter: true
  showRandomTip: false
  showCommandLog: true
  commandLogSize: 8
  splitDiff: auto # auto / always
  # Time format
  timeFormat: "2006-01-02 15:04"
  shortTimeFormat: "15:04"
