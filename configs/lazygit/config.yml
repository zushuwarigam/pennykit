# OS integration
os:
  # Open files from lazygit directly in your editor
  edit: "nvim {{filename}}" # change to code, hx, etc.
  editAtLine: "nvim +{{line}} {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  open: "xdg-open {{link}}"
# ── Refreshing ───────────────────────────────────────────────
refresher:
  refreshInterval: 10
  fetchInterval: 60
# ── Update ───────────────────────────────────────────────────
update:
  method: prompt # prompt / always / never
  days: 14
