name: CI

on:
  push:
    branches: [kit, kit-dev, main]
  pull_request:
    branches: [kit, kit-dev, main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit tests (shellcheck / hadolint / BATS / pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck python3-pytest \
            || sudo apt-get install -y -qq shellcheck python3-pytest
          # bats-core via apt when available, else npm
          if ! command -v bats >/dev/null 2>&1; then
            sudo apt-get install -y -qq bats 2>/dev/null \
              || npm install -g bats >/dev/null 2>&1
          fi
          # hadolint has no apt package — grab the static binary
          curl -sSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
          shellcheck --version | head -1
          bats --version 2>/dev/null || true
          hadolint --version
          python3 -m pytest --version

      - name: Run PennyKit test suite
        run: bash scripts/test/run_tests.sh

      - name: Verify test tools were exercised (no vacuous pass)
        run: |
          bash scripts/test/run_tests.sh >/tmp/tests.log 2>&1 || true
          grep -q "Skipped tier(s)" /tmp/tests.log \
            && { echo "A test tier was skipped — CI must run all tiers"; cat /tmp/tests.log; exit 1; } || true

  docker-install-verify:
    # Manual trigger only: builds the full Docker images and verifies the install.
    # The unit-tests job is the fast gate; this is the slow end-to-end check.
    name: Docker install (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify Docker install
        run: bash scripts/test/test_docker_install.sh --verify
        timeout-minutes: 360